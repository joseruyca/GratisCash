name: Cleanup bootstrap

on:
  push:
    paths:
      - '.github/workflows/bootstrap-project.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary bootstrap files
        shell: bash
        run: |
          rm -rf bootstrap bootstrap10 .github/workflows/bootstrap-project.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary bootstrap files" || exit 0
          git push
