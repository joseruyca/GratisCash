name: Import GratisCash V8

on:
  push:
    branches: [main]
    paths:
      - 'bootstrap_v8/**'
      - '.github/scripts/finalize_v8.py'
      - '.github/workflows/import-v8.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild, transform and commit V8
        shell: bash
        run: |
          set -euo pipefail
          TMP_DIR="$(mktemp -d)"
          mkdir -p "$TMP_DIR/extracted"

          git show ed205bb0b62acd81f0fa2d3bdc6119e56c3a681f:bootstrap10/part00.b64 > "$TMP_DIR/project.b64"
          git show ed205bb0b62acd81f0fa2d3bdc6119e56c3a681f:bootstrap10/part01.b64 >> "$TMP_DIR/project.b64"
          git show ed205bb0b62acd81f0fa2d3bdc6119e56c3a681f:bootstrap10/part02.b64 >> "$TMP_DIR/project.b64"
          git show ed205bb0b62acd81f0fa2d3bdc6119e56c3a681f:bootstrap10/part03.b64 >> "$TMP_DIR/project.b64"
          git show ed205bb0b62acd81f0fa2d3bdc6119e56c3a681f:bootstrap10/part04.b64 >> "$TMP_DIR/project.b64"
          git show ed205bb0b62acd81f0fa2d3bdc6119e56c3a681f:bootstrap10/part05.b64 >> "$TMP_DIR/project.b64"
          git show ed205bb0b62acd81f0fa2d3bdc6119e56c3a681f:bootstrap10/part07.b64 >> "$TMP_DIR/project.b64"
          cat bootstrap_v8/tail0.b64 bootstrap_v8/tail1.b64 bootstrap_v8/tail2.b64 >> "$TMP_DIR/project.b64"

          base64 -d "$TMP_DIR/project.b64" > "$TMP_DIR/project.zip"
          unzip -tq "$TMP_DIR/project.zip"
          unzip -q "$TMP_DIR/project.zip" -d "$TMP_DIR/extracted"

          python .github/scripts/finalize_v8.py "$TMP_DIR/extracted"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a "$TMP_DIR/extracted"/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore complete GratisCash V8"
          git push
